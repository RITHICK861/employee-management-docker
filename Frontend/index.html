<!DOCTYPE html>
<html>
<head>
    <title>Employee Portal</title>
</head>
<body>

<h1>Employee Portal</h1>

<button onclick="loadData()">Load Employees</button>

<ul id="employees"></ul>

<script>
function loadData() {
    fetch("http://localhost:5000/employees")
    .then(response => response.json())
    .then(data => {

        let output = "";

        data.forEach(emp => {
            output += `<li>${emp.name} - ${emp.department}</li>`;
        });

        document.getElementById("employees").innerHTML = output;

    });
}
</script>

</body>
</html>
